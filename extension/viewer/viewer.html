<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>FAINES PDF</title>
<link rel="stylesheet" href="pdfjs/web/pdf_viewer.css">
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<header id="toolbar">
  <button id="btnSidebar" title="しおり (目次) の表示/非表示">☰</button>
  <button id="btnBack" title="戻る (Alt+←)">◀</button>
  <button id="btnForward" title="進む (Alt+→)">▶</button>
  <span class="sep"></span>
  <button id="btnPrev" title="前のページ">↑</button>
  <input id="pageNumber" type="number" min="1" value="1" title="ページ番号">
  <span id="numPages">/ -</span>
  <button id="btnNext" title="次のページ">↓</button>
  <span class="sep"></span>
  <button id="btnZoomOut" title="縮小">－</button>
  <select id="scaleSelect" title="倍率">
    <option value="page-width">幅に合わせる</option>
    <option value="page-fit">ページ全体</option>
    <option value="auto">自動</option>
    <option value="0.75">75%</option>
    <option value="1">100%</option>
    <option value="1.25">125%</option>
    <option value="1.5">150%</option>
    <option value="2">200%</option>
    <option value="3">300%</option>
  </select>
  <button id="btnZoomIn" title="拡大">＋</button>
  <span class="sep"></span>
  <input id="findInput" type="search" placeholder="文書内を検索" title="Enterで次を検索 (Shift+Enterで前)">
  <span id="findMsg"></span>
  <span id="docTitle"></span>
  <button id="btnRaw" title="Chrome標準のPDF表示で開く">標準表示</button>
</header>
<div id="main">
  <nav id="sidebar"><div id="outline"></div></nav>
  <div id="viewerContainer" tabindex="0">
    <div id="viewer" class="pdfViewer"></div>
  </div>
</div>
<div id="status"></div>
<script type="module" src="viewer.js"></script>
</body>
</html>
