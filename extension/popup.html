<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  body { width: 300px; margin: 0; padding: 12px 14px; font: 13px/1.5 system-ui, "Hiragino Sans", "Meiryo", sans-serif; color: #1f2328; }
  h1 { font-size: 14px; margin: 0 0 8px; color: #c71444; }
  label { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
  label small { display: block; color: #57606a; }
  hr { border: 0; border-top: 1px solid #d0d7de; margin: 8px 0; }
  button { font: inherit; padding: 3px 10px; }
  #msg { color: #1a7f37; min-height: 1.5em; }
  #ver { color: #57606a; font-size: 12px; }
  #update a { color: #c71444; font-weight: 600; }
  #report { margin-top: 6px; }
</style>
</head>
<body>
<h1>レガシー整備書サポート</h1>
<label><input type="checkbox" id="ieCompat"><span>IE専用画面の互換モード<small>古い閲覧画面 (日産ESM 等) のIE専用機能を補います</small></span></label>
<label><input type="checkbox" id="pdfViewer"><span>PDFを専用ビューアで開く<small>別PDFへのしおり・目次リンク (トヨタ旧PDF 等) を辿れます</small></span></label>
<hr>
<button id="reset" title="この資料で自動的に有効にしたIEモードの記録を消します">IEモード記録をリセット</button>
<div id="msg"></div>
<hr>
<div id="ver"></div>
<div id="update" hidden><a id="updateLink" target="_blank">新しい版 <b id="latest"></b> があります</a></div>
<button id="report" title="開いているページの情報を入れた報告フォームを開きます">表示されない資料を報告</button>
<script src="popup.js"></script>
</body>
</html>
